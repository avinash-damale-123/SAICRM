name: Consolidated Records source and QA
on:
  push:
    branches: [feat/business-lines-page-export-20261020]
    paths: ['.github/workflows/records-source-sync.yml']
permissions:
  contents: write
jobs:
  source-and-test:
    if: github.repository == 'avinash-damale-123/SAICRM'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://crm:test-only-password@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-lines-page-export-20261020
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hash-verified source files to the authorized feature branch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          const expected='cd3bd54f50a114caab71969872347ed4c4524496f919ed5e55310cf514fb595a';
          const base='c7cb1d7cefc996c5ba04557d9562375c9f9acc85';
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          if(parent!==base)throw Error('Branch advanced; reconcile before applying source');
          const response=await fetch('https://sb-21zixu64kyfi.vercel.run/'+expected+'.json.gz',{signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw Error('Reviewed source bundle unavailable');
          const bytes=Buffer.from(await response.arrayBuffer());
          if(bytes.length>1000000||createHash('sha256').update(bytes).digest('hex')!==expected)throw Error('Source checksum mismatch');
          const data=JSON.parse(gunzipSync(bytes,{maxOutputLength:2000000}).toString('utf8'));
          if(data.base!==base)throw Error('Unexpected source base');
          const allowed=new Set(['api/index.js','index.html','module-workspace.js','package-lock.json','package.json','scripts/build.mjs','scripts/migrate.mjs','server/api.mjs','server/business-lines.mjs','server/resources.mjs','test/business-line-permissions.test.mjs','test/integration.test.mjs','vercel.json','db/007_records_framework.sql','records-tools.css','records-tools.js','server/records-files.mjs','server/records-framework.mjs','server/records-jobs.mjs','server/records-policy.mjs','server/records-schema.mjs','server/records-worker.mjs','test/records-framework-browser.mjs','test/records-framework.test.mjs','test/business-lines-browser.mjs','docs/records-framework.md','docs/implementation-progress.md']);
          if(Object.keys(data.files).length!==allowed.size)throw Error('Incomplete source manifest');
          for(const [name,content]of Object.entries(data.files)){if(!allowed.has(name)||typeof content!=='string'||content.length>300000)throw Error('Unexpected source file');fs.mkdirSync(path.dirname(name),{recursive:true});fs.writeFileSync(name,content);}
          execFileSync('git',['config','user.name','github-actions[bot]']);
          execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
          execFileSync('git',['add','--',...allowed]);
          execFileSync('git',['commit','-m','Finalize consolidated Records framework, import/export safety, contextual views and complete regression coverage']);
          execFileSync('git',['push','origin','HEAD:feat/business-lines-page-export-20261020']);
          console.log('Committed reviewed Records source; production branch unchanged.');
          NODE
      - run: npm ci --ignore-scripts
      - run: node scripts/build.mjs
      - run: node --check records-tools.js && node --check module-workspace.js && node --check server/records-framework.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:business-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-records-browser-qa
          path: work/browser/
          retention-days: 7
