name: Reproducible records QA workspace
on:
  pull_request:
    paths:
      - '.github/workflows/workspace-qa.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Package tracked source and test dependencies (never credentials)
        run: |
          mkdir -p /tmp/saicrm-qa/source
          git archive HEAD | tar -x -C /tmp/saicrm-qa/source
          cp -a node_modules /tmp/saicrm-qa/source/
          tar -czf /tmp/saicrm-qa/workspace.tgz -C /tmp/saicrm-qa/source .
      - uses: actions/upload-artifact@v4
        with:
          name: saicrm-isolated-qa-workspace
          path: /tmp/saicrm-qa/workspace.tgz
          retention-days: 2
