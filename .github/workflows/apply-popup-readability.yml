name: Apply reviewed popup presentation patch
on:
  push:
    branches: [ui/business-lines-popup-readability-20261021]
    paths: [.github/workflows/apply-popup-readability.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'avinash-damale-123/SAICRM' && github.ref == 'refs/heads/ui/business-lines-popup-readability-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/business-lines-popup-readability-20261021
      - name: Verify and apply the reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --max-time 30 'https://sb-21zixu64kyfi.vercel.run/popup-polish-ae9d2e42.patch' -o /tmp/popup-polish.patch
          echo 'ae9d2e4226f4c19d48d2c65ac4907144b865ea5493b28ff7e24f93359f4a5193  /tmp/popup-polish.patch' | sha256sum -c -
          git apply --check /tmp/popup-polish.patch
          git apply /tmp/popup-polish.patch
          rm .github/workflows/apply-popup-readability.yml
          git add -- module-workspace.js module-workspace.css index.html test/business-lines-modal-browser.mjs test/records-authenticated-browser.mjs docs/business-lines-popup-polish.md .github/workflows/apply-popup-readability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish Business Lines popup spacing, centered green header and prominent controls'
          git push origin HEAD:ui/business-lines-popup-readability-20261021
