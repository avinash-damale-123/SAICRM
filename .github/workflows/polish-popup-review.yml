name: Apply reviewed popup visual polish
on:
  push:
    branches: [ui/business-lines-all-popups-20261021]
    paths: ['.github/workflows/polish-popup-review.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/business-lines-all-popups-20261021
      - name: Apply locally tested section spacing and navigation correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('module-workspace.css');s=p.read_text()
          assert 'Restore the section index inside popups and separate section cards.' not in s
          p.write_text(s+'''
          /* Restore the section index inside popups and separate section cards. */
          .mw-bl-record-dialog .mw-bl-detail-index{display:flex!important}
          .mw-bl-record-dialog :is(.mw-bl-form,.mw-bl-read){display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
          @media(max-width:600px){.mw-bl-dialog:is(.mw-bl-create-dialog,.mw-bl-record-dialog){width:calc(100% - 16px)!important;max-width:calc(100% - 16px)!important}}
          ''')
          p=Path('test/business-lines-modal-browser.mjs');s=p.read_text();marker="await openFirst();await assertModal('read');await assertFields();await page.locator('[data-bl-expand=\"1\"]').click();"
          assert marker in s
          s=s.replace(marker,marker+"\n assert.equal(await page.locator('.mw-bl-detail-index').isVisible(),true);await page.locator('[data-bl-jump=\"3\"]').click();assert.equal(await page.locator('.mw-bl-detail-content .mw-bl-section').nth(3).locator('details').getAttribute('open'),'');await page.locator('.mw-dialog-body').evaluate(el=>el.scrollTop=0);")
          p.write_text(s)
          Path('.github/workflows/polish-popup-review.yml').unlink()
          PY
          git add module-workspace.css test/business-lines-modal-browser.mjs .github/workflows/polish-popup-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep section jump controls visible in record popups and separate grouped cards'
          git push origin HEAD:ui/business-lines-all-popups-20261021
