name: Apply reviewed Business Lines popup patch
on:
  push:
    branches: [ui/business-lines-all-popups-20261021]
    paths: ['.github/workflows/apply-popup-review.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/business-lines-all-popups-20261021
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify and apply isolated QA source patch
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, subprocess
          from pathlib import Path
          url='https://sb-21zixu64kyfi.vercel.run/popup-review-5f70e190.patch'
          data=urllib.request.urlopen(url, timeout=30).read(200000)
          assert hashlib.sha256(data).hexdigest()=='5f70e190f0e1cff07c964d61656d091d2abecc237f3b1e710dc7b262ec62ed4c', 'Reviewed patch digest mismatch'
          path=Path('/tmp/popup-review.patch');path.write_bytes(data)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          allowed={'docs/business-lines-popup-review.md','index.html','module-header.css','module-workspace.css','module-workspace.js','package.json','records-tools.css','records-tools.js','test/business-lines-browser.mjs','test/business-lines-modal-browser.mjs','test/records-authenticated-browser.mjs','.github/workflows/apply-popup-review.yml'}
          changed=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          for line in changed:
              assert line[3:] in allowed, 'Unexpected file: '+line[3:]
          Path('.github/workflows/apply-popup-review.yml').unlink()
          PY
          node --check module-workspace.js
          node --check records-tools.js
          node --check test/business-lines-modal-browser.mjs
          git add --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify Business Lines Create Read and Edit popups and compact both view toolbars'
          git push origin HEAD:ui/business-lines-all-popups-20261021
