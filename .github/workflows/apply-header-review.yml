name: Apply tested header review
on:
  push:
    branches: [ui/business-lines-top-search-tabs-20261021]
    paths: ['.github/workflows/apply-header-review.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'avinash-damale-123/SAICRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/business-lines-top-search-tabs-20261021
      - name: Apply exact sandbox-tested patch and remove this one-time workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          encoded='''
          
          
          
          
          '''
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='5446a6a281170d84c02d73bc3e5b2c403ae4a7ca709cb1fead13d29d49c5eee1'
          allowed={'index.html','module-header.css','module-header.js','records-tools.js','test/header-visual.mjs','test/records-framework-browser.mjs'}
          paths={line.split()[2][2:] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          assert paths==allowed
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          Path('.github/workflows/apply-header-review.yml').unlink()
          PY
          node --check module-header.js
          node --check records-tools.js
          node --check test/records-framework-browser.mjs
          git add index.html module-header.css module-header.js records-tools.js test/header-visual.mjs test/records-framework-browser.mjs .github/workflows/apply-header-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Move Business Lines search before bell and highlight active Records or Overview tab'
          git push origin HEAD:ui/business-lines-top-search-tabs-20261021
