name: Backend security checks
on:
  push:
    branches: [main, codex/production-crm-auth, codex/business-lines]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://crm:test-only-password@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/build.mjs
      - run: node --check app.js && node --check auth.js && node --check responsive.js
      - run: node --check module-workspace.js && node --check records-tools.js
      - run: node --check business-lines-ui.js
      - run: npm test
      - name: Department migration and real PostgreSQL transfer acceptance
        run: node test/department-db-acceptance.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:business-browser
      - name: Real PostgreSQL authenticated browser acceptance
        run: node --trace-deprecation test/records-authenticated-browser.mjs
      - name: Isolated scale and recovery acceptance
        if: ${{ !cancelled() && matrix.node == 24 }}
        run: node test/records-load.mjs
        env:
          RECORDS_LOAD_ROWS: 500000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks-node${{ matrix.node }}
          path: work/browser/
          retention-days: 14
