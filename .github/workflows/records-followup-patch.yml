name: Apply reviewed Records acceptance patch
on:
  push:
    branches: [fix/records-acceptance-20261021]
    paths: ['.github/workflows/records-followup-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'avinash-damale-123/SAICRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/records-acceptance-20261021
      - name: Make the initial authentication check an explicit non-interactive state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('auth.js')
          s=p.read_text()
          old="let email='', csrf='', user=null, loaded=false, mode='login', resetToken='', googleEnabled=false, remember=false;"
          assert s.count(old)==1
          s=s.replace(old,old+"\n let authInitializing=true;")
          old="  document.querySelector('#authForm').onsubmit=async event=>{"
          assert s.count(old)==1
          s=s.replace(old,"  root.inert=authInitializing;root.setAttribute('aria-busy',String(authInitializing));\n  if(authInitializing)root.querySelectorAll('input,button,select,textarea').forEach(control=>control.disabled=true);\n"+old)
          old="then(([session,options])=>{googleEnabled=options.googleEnabled===true;return session})"
          assert s.count(old)==1
          s=s.replace(old,"then(([session,options])=>{authInitializing=false;root.inert=false;root.setAttribute('aria-busy','false');googleEnabled=options.googleEnabled===true;return session})")
          old=".catch(error=>draw(error.message));"
          assert s.count(old)==1
          s=s.replace(old,".catch(error=>{authInitializing=false;root.inert=false;root.setAttribute('aria-busy','false');draw(error.message)});")
          p.write_text(s)
          p=Path('test/records-authenticated-browser.mjs')
          s=p.read_text()
          old="async function login(email){await page.goto(origin);await page.locator('#authEmail').fill(email);await page.locator('#authPassword').fill(password);await page.locator('#submitAuth').click();await page.locator('#navigation [data-nav]').first().waitFor();}"
          assert s.count(old)==1
          new="async function login(email){await page.goto(origin);await page.locator('#authEmail').fill(email);assert.equal(await page.locator('#authRoot').getAttribute('aria-busy'),'false');await page.locator('#authPassword').fill(password);const response=page.waitForResponse(r=>r.url().endsWith('/api/auth/login')&&r.request().method()==='POST');await page.locator('#submitAuth').click();assert.equal((await response).status(),200);await page.locator('#navigation [data-nav]').first().waitFor();}"
          p.write_text(s.replace(old,new))
          p=Path('index.html')
          s=p.read_text()
          import re
          s,count=re.subn(r'auth\.js\?v=[^"\s]+','auth.js?v=auth-initialization-20261021',s)
          assert count==1
          p.write_text(s)
          PY
          node --check auth.js
          node --check test/records-authenticated-browser.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth.js index.html test/records-authenticated-browser.mjs
          git commit -m 'Guard login input until session initialization completes, preserving fast-user credentials'
          git push origin HEAD:fix/records-acceptance-20261021
