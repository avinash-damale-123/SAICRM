name: Apply reviewed Records acceptance patch
on:
  push:
    branches: [fix/records-acceptance-20261021]
    paths: ['.github/workflows/records-followup-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'avinash-damale-123/SAICRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/records-acceptance-20261021
      - name: Preserve visible record navigation and mirror background execution in isolated tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('module-workspace.js')
          s=p.read_text()
          needle="  const page=blDetail,detailSections=[...page.querySelectorAll('.mw-bl-detail-content .mw-bl-section')];"
          assert s.count(needle)==1, 'Reviewed navigation marker must be unique'
          addition="\n  // Keep Back usable when the redundant detail breadcrumb is hidden.\n  if(recordsTools?.enabled){const back=page.querySelector('#bl-back');back.className='mw-btn';back.textContent='Back to Records';page.querySelector('.mw-bl-detail-actions').prepend(back);}\n"
          assert addition not in s, 'Patch was already applied'
          p.write_text(s.replace(needle,needle+addition))
          p=Path('test/records-authenticated-browser.mjs')
          s=p.read_text().replace("import {configuration,createHandler} from '../server/api.mjs';", "import {configuration,createHandler} from '../server/api.mjs';\nimport {processTransfer} from '../server/records-worker.mjs';")
          s=s.replace("const handler=createHandler({pool,config,deliver:async message=>mail.push(message)});", "const pending=new Set();\nconst handler=createHandler({pool,config,deliver:async message=>mail.push(message),enqueue:id=>{const task=processTransfer(pool,id,{budgetMs:60000});pending.add(task);task.finally(()=>pending.delete(task));}});")
          s=s.replace("await pool.end();await rm(privateDir", "await Promise.allSettled([...pending]);await pool.end();await rm(privateDir")
          p.write_text(s)
          PY
          node --check module-workspace.js
          node --check test/records-authenticated-browser.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module-workspace.js test/records-authenticated-browser.mjs
          git commit -m 'Keep Back to Records visible and test real authenticated background workflows'
          git push origin HEAD:fix/records-acceptance-20261021
