name: Apply reviewed Records acceptance patch
on:
  push:
    branches: [fix/records-acceptance-20261021]
    paths: ['.github/workflows/records-followup-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'avinash-damale-123/SAICRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/records-acceptance-20261021
      - name: Require a genuine backdrop pointer gesture before dismissing a modal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('module-workspace.js')
          s=p.read_text()
          needle="dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog()});"
          assert s.count(needle)==1, 'Reviewed modal marker must be unique'
          replacement="let backdropPointer=false;const onBackdrop=e=>{const r=dialog.getBoundingClientRect();return e.target===dialog&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)};dialog.addEventListener('pointerdown',e=>{backdropPointer=onBackdrop(e)});dialog.addEventListener('click',e=>{const dismiss=backdropPointer&&onBackdrop(e);backdropPointer=false;if(dismiss)closeDialog()});"
          p.write_text(s.replace(needle,replacement))
          PY
          node --check module-workspace.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module-workspace.js
          git commit -m 'Do not dismiss Create modal when blur validation shifts the Save button'
          git push origin HEAD:fix/records-acceptance-20261021
