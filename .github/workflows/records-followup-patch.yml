name: Apply reviewed Records acceptance patch
on:
  push:
    branches: [fix/records-acceptance-20261021]
    paths: ['.github/workflows/records-followup-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'avinash-damale-123/SAICRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/records-acceptance-20261021
      - name: Test native logout with its existing CSRF body contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/records-authenticated-browser.mjs')
          s=p.read_text()
          marker='async function browserAPI(path,method='
          assert s.count(marker)==1
          helper="async function logout(){const response=page.waitForResponse(r=>r.url().endsWith('/api/auth/logout')&&r.request().method()==='POST');await page.evaluate(()=>document.querySelector('#logoutBtn').click());assert.equal((await response).status(),200);await page.locator('#submitAuth').waitFor();}\n"
          s=s.replace(marker,helper+marker)
          old="await browserAPI('auth/logout','POST',{});"
          assert s.count(old)==2
          p.write_text(s.replace(old,'await logout();'))
          p=Path('index.html')
          s=p.read_text()
          assert 'module-workspace.js?v=records-release-1' in s
          p.write_text(s.replace('module-workspace.js?v=records-release-1','module-workspace.js?v=records-acceptance-2'))
          PY
          node --check test/records-authenticated-browser.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/records-authenticated-browser.mjs index.html
          git commit -m 'Verify actual protected logout and cache-bust repaired record navigation'
          git push origin HEAD:fix/records-acceptance-20261021
