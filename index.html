<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12243c">
  <meta name="scrm-ui-version" content="responsive-20261015">
  <title>SCRM | Satguru Enterprise CRM</title>

<body>
<a class="skip-link" href="#content">Skip to content</a>
<div id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brandmark" aria-hidden="true">S</div>
      <div class="brand-copy"><strong>SCRM</strong><small>Satguru Enterprise CRM</small></div>
      <button class="iconbtn mobile-close" id="closeNav" aria-label="Close navigation" type="button">&#215;</button>
    </div>
    <div class="workspace">
      <div class="workspace-icon" aria-hidden="true">ST</div>
      <div class="workspace-copy"><b>Satguru Travel Group</b><small>Enterprise workspace</small></div>
    </div>
    <nav id="navigation" class="navigation" aria-label="CRM modules"></nav>
    <div class="sidebar-bottom">
      <div class="profile" title="Demo Administrator - local demo session">
        <div class="avatar" aria-hidden="true">SA</div>
        <div class="profile-copy"><b>Demo Administrator</b><small><span class="pulse"></span>Local demo &middot; UI v0.2</small></div>
      </div>
    </div>
  </aside>
  <button id="navBackdrop" class="nav-backdrop" type="button" aria-label="Close navigation" tabindex="-1" hidden></button>
  <div class="main">
    <header class="topbar">
      <div class="top-left">
        <button id="menuBtn" class="iconbtn nav-toggle" type="button" aria-label="Collapse navigation" aria-controls="sidebar" aria-expanded="true">&#9776;</button>
        <div class="breadcrumb"><span class="workspace-label">Workspace</span><span class="separator" aria-hidden="true">/</span><strong id="crumb">Overview</strong></div>
      </div>
      <div class="top-actions">
        <button id="globalSearchBtn" class="search-trigger" type="button" aria-label="Find a module (Control K)">&#8981; <span>Find a module...</span><kbd>Ctrl K</kbd></button>
        <span class="environment"><span class="pulse"></span>UAT / DEMO</span>
        <button id="notifBtn" class="iconbtn" type="button" aria-label="Notifications" title="Notifications">&#9831;<i></i></button>
        <div class="top-avatar" title="Demo Administrator" aria-label="Demo Administrator">SA</div>
      </div>
    </header>
    <main id="content" class="content" tabindex="-1"></main>
  </div>
</div>
<div id="overlay" class="overlay hidden" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-head"><div><div class="eyebrow" id="modalEyebrow">SCRM</div><h2 id="modalTitle">New record</h2></div><button class="iconbtn" id="closeModal" type="button" aria-label="Close dialog">&#10005;</button></div>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="./app.js"></script>
<script src="./responsive.js?v=20261015-responsive"></script>
